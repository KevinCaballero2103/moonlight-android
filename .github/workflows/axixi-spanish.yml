name: Axixi Moonlight ES

on:
  push:
    branches: [feature/spanish-interface]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
      - name: Check localization and input
        run: |
          python3 dev/check-spanish-interface.py
          sh dev/check-virtual-input.sh
      - name: Run tests and build Spanish APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PincludeKishiHaptics=false -PincludeStereo3dAi=false \
            :app:testNonRootDebugUnitTest :app:assembleNonRootDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk dist/axixi-moonlight-es-v13.apk
          cp presets/genshin/axi_OSC_Keyboard_es.txt dist/genshin-controles-es.txt
          sha256sum dist/axixi-moonlight-es-v13.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axixi-moonlight-es
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*
            app/build/test-results/testNonRootDebugUnitTest/*.xml
      - name: Publish validated APK and preset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          axixi_es_tag="axixi-es-v13-${GITHUB_SHA:0:7}"
          if gh release view "$axixi_es_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$axixi_es_tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$axixi_es_tag" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Axixi Moonlight ES · v13" --notes-file dev/RELEASE-v13.md
          fi
